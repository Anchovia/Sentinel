services:
  api:
    environment:
      QF_ENVIRONMENT: paper
      QF_TRADING_MODE: paper
      QF_ALLOW_ORDER_SUBMISSION: "false"
    volumes:
      - ./runtime_exports:/app/runtime_exports
      - ./reports:/app/reports

  paper-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - quantforge
      - run-paper
      - --markets
      - ALL-KRW
      - --focus-markets
      - "20"
      - --streams
      - ticker,trade,orderbook
      - --heartbeat-seconds
      - "15"
      - --flush-seconds
      - "60"
      - --storage-label
      - ${QF_PAPER_DATA_LABEL:-local-paper-data}
      - --storage-retention-days
      - "30"
      - --storage-max-gib
      - "50"
      - --storage-min-free-gib
      - "20"
      - --storage-maintenance-seconds
      - "900"
      - --storage-compaction-min-files
      - "4"
      - --storage-compaction-target-rows
      - "250000"
    environment:
      QF_ENVIRONMENT: paper
      QF_TRADING_MODE: paper
      QF_ALLOW_ORDER_SUBMISSION: "false"
      QF_LIVE_RELEASE_MANIFEST_VALID: "false"
      QF_RISK_POLICY_APPROVED: "false"
      QF_MODEL_RELEASE_APPROVED: "false"
      QF_OPERATOR_UNLOCK_PRESENT: "false"
      QF_UPBIT_ACCESS_KEY: ""
      QF_UPBIT_SECRET_KEY: ""
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ${QF_PAPER_DATA_HOST_PATH:-./data/paper}
        target: /app/data/paper
      - ./runtime_exports:/app/runtime_exports
    healthcheck:
      test:
        - CMD
        - quantforge
        - paper-status
        - --require-fresh-seconds
        - "90"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    restart: unless-stopped
