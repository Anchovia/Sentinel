name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QF_TRADING_MODE: paper
      QF_ALLOW_ORDER_SUBMISSION: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.5"
          enable-cache: true
          python-version: "3.13.15"
      - name: Sync locked environment
        run: uv sync --frozen --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Tests
        run: uv run pytest --cov=quantforge --cov-report=term-missing
      - name: Secret guard
        run: uv run python scripts/check_no_secrets.py
      - name: Dependency audit
        run: uv run pip-audit --progress-spinner off
      - name: Container build
        run: docker build --tag quantforge:ci .
