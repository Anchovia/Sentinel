name: quantforge

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      QF_ENVIRONMENT: development
      QF_TRADING_MODE: paper
      QF_ALLOW_ORDER_SUBMISSION: "false"
      QF_LIVE_RELEASE_MANIFEST_VALID: "false"
      QF_RISK_POLICY_APPROVED: "false"
      QF_MODEL_RELEASE_APPROVED: "false"
      QF_OPERATOR_UNLOCK_PRESENT: "false"
      QF_DASHBOARD_ACCESS_TOKEN: ${QF_DASHBOARD_ACCESS_TOKEN:-}
      QF_DASHBOARD_CSRF_SECRET: ${QF_DASHBOARD_CSRF_SECRET:-}
      QF_DATABASE_URL: postgresql+asyncpg://quantforge:quantforge@postgres:5432/quantforge
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - operations-state:/app/data/operations
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: quantforge
      POSTGRES_USER: quantforge
      POSTGRES_PASSWORD: quantforge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantforge -d quantforge"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
  grafana-data:
  operations-state:
